<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.22" />
    </pattern>

    <!-- Top Glow Line -->
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
    
    .status-dot-pulse {
      transform-origin: 72px 52px;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Base Card Frame with Border -->
  <rect x="2" y="2" width="896" height="296" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="896" height="296" rx="14" fill="url(#glowCyan)" />
  <rect x="2" y="2" width="896" height="296" rx="14" fill="url(#glowPurple)" />

  <!-- Dot Matrix Layer -->
  <rect x="2" y="2" width="896" height="296" rx="14" fill="url(#dotGrid)" />

  <!-- Subtle Top Accent Line -->
  <path d="M 120 2 L 780 2" stroke="url(#topLineGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Status Indicator Badge -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="294" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="url(#badgeBorderGrad)" stroke-width="1" />
    <!-- Glowing Ring -->
    <circle class="status-dot-pulse" cx="18" cy="15" r="5" fill="#10b981" fill-opacity="0.35" />
    <!-- Core Dot -->
    <circle cx="18" cy="15" r="3.5" fill="#10b981" />
    <text x="32" y="19" fill="#94a3b8" class="mono" font-size="11" font-weight="600" letter-spacing="0.8">AVAILABLE FOR SELECT ROLES</text>
  </g>

  <!-- Terminal Location/Institution Tag (Top Right) -->
  <g transform="translate(620, 36)">
    <text x="230" y="20" fill="#64748b" class="mono" font-size="11" text-anchor="end" letter-spacing="0.5">MUET · BE SYSTEMS ENG '26</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="url(#textGrad)" class="sans" font-size="38" font-weight="800" letter-spacing="-0.8">MUHAMMAD HASHIM</text>
  </g>

  <!-- Role / Architectural Focus -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#e2e8f0" class="sans" font-size="16" font-weight="500" letter-spacing="-0.2">
      Mobile Application Engineer <tspan fill="#38bdf8">·</tspan> <tspan fill="#94a3b8">Flutter Architecture &amp; Applied AI Systems</tspan>
    </text>
  </g>

  <!-- Clean Minimal Separator -->
  <line x1="48" y1="190" x2="852" y2="190" stroke="#1e293b" stroke-width="1" />

  <!-- High-Craft Architectural Focus Pills -->
  <g transform="translate(48, 216)">
    <!-- Pill 1: Mobile Core -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="url(#pillBorderGrad)" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" class="mono" font-size="12" font-weight="700">#</text>
      <text x="28" y="22" fill="#cbd5e1" class="sans" font-size="12.5" font-weight="600">Flutter &amp; Dart Core</text>
    </g>

    <!-- Pill 2: Architecture -->
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="188" height="36" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="url(#pillBorderGrad)" stroke-width="1" />
      <text x="14" y="22" fill="#818cf8" class="mono" font-size="12" font-weight="700">#</text>
      <text x="28" y="22" fill="#cbd5e1" class="sans" font-size="12.5" font-weight="600">Clean Architecture</text>
    </g>

    <!-- Pill 3: State & Persistence -->
    <g transform="translate(392, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="url(#pillBorderGrad)" stroke-width="1" />
      <text x="14" y="22" fill="#a855f7" class="mono" font-size="12" font-weight="700">#</text>
      <text x="28" y="22" fill="#cbd5e1" class="sans" font-size="12.5" font-weight="600">BLoC · Hive · Offline</text>
    </g>

    <!-- Pill 4: Systems / AI -->
    <g transform="translate(584, 0)">
      <rect x="0" y="0" width="220" height="36" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="url(#pillBorderGrad)" stroke-width="1" />
      <text x="14" y="22" fill="#34d399" class="mono" font-size="12" font-weight="700">#</text>
      <text x="28" y="22" fill="#cbd5e1" class="sans" font-size="12.5" font-weight="600">Multi-Agent &amp; ML Models</text>
    </g>
  </g>
</svg>
