<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <pattern id="cardDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.18" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="156" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="156" rx="12" fill="url(#cardDots)" />

  <!-- Column 1: Core Discipline -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" fill="#38bdf8" class="mono" font-size="11" font-weight="700" letter-spacing="1">01 / MOBILE CORE</text>
    <text x="0" y="30" fill="#f8fafc" class="sans" font-size="18" font-weight="700">Flutter &amp; Dart</text>
    <text x="0" y="52" fill="#94a3b8" class="sans" font-size="13">Clean Arch · BLoC Pattern</text>
    <text x="0" y="70" fill="#64748b" class="mono" font-size="11.5">Offline-first · Hive · Riverpod</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="245" y1="28" x2="245" y2="132" stroke="#1e293b" stroke-width="1" />

  <!-- Column 2: Systems & AI -->
  <g transform="translate(275, 32)">
    <text x="0" y="0" fill="#818cf8" class="mono" font-size="11" font-weight="700" letter-spacing="1">02 / SYSTEMS &amp; AI</text>
    <text x="0" y="30" fill="#f8fafc" class="sans" font-size="18" font-weight="700">Applied ML &amp; Agents</text>
    <text x="0" y="52" fill="#94a3b8" class="sans" font-size="13">7-Agent AI Systems · Scikit-Learn</text>
    <text x="0" y="70" fill="#64748b" class="mono" font-size="11.5">Real-time Simulation · Pygame</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="510" y1="28" x2="510" y2="132" stroke="#1e293b" stroke-width="1" />

  <!-- Column 3: Production Work -->
  <g transform="translate(540, 32)">
    <text x="0" y="0" fill="#34d399" class="mono" font-size="11" font-weight="700" letter-spacing="1">03 / TRACK RECORD</text>
    <text x="0" y="30" fill="#f8fafc" class="sans" font-size="18" font-weight="700">3x Engineering Intern</text>
    <text x="0" y="52" fill="#94a3b8" class="sans" font-size="13">ITSOLERA · Dexter Digitech · SoftGrid</text>
    <text x="0" y="70" fill="#64748b" class="mono" font-size="11.5">DexCounsel · Budgetly · FocusPulse</text>
  </g>

  <!-- Vertical Divider 3 -->
  <line x1="745" y1="28" x2="745" y2="132" stroke="#1e293b" stroke-width="1" />

  <!-- Column 4: Academics -->
  <g transform="translate(765, 32)">
    <text x="0" y="0" fill="#f59e0b" class="mono" font-size="11" font-weight="700" letter-spacing="1">04 / DEGREE</text>
    <text x="0" y="30" fill="#f8fafc" class="sans" font-size="18" font-weight="700">BE Systems Eng</text>
    <text x="0" y="52" fill="#94a3b8" class="sans" font-size="13">Mehran Univ (MUET)</text>
    <text x="0" y="70" fill="#64748b" class="mono" font-size="11.5">Class of 2026 · CGPA 3.15</text>
  </g>
</svg>
